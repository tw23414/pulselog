name: Build PULSELOG Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'index.html'
      - 'main.cjs'
      - 'package.json'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist

      - name: Upload installer as a direct EXE release asset
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          target_commitish: main
          name: PULSELOG v2.0.0
          body: |
            PULSELOG v2.0.0 Windows desktop installer.

            Download the .exe asset below. No ZIP extraction is needed.
          files: dist/*.exe
          fail_on_unmatched_files: true

      - name: Upload installer build artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: PULSELOG-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
